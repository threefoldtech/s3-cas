[package]
name = "s3-cas"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
readme = "README.md"
description = "An experimental S3 server using a cas storage layer"

[features]
default = []

[dependencies]
# CAS storage library
cas-storage = { path = "../cas-storage" }

# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
bytes.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
md-5.workspace = true
faster-hex.workspace = true

# S3-specific dependencies
s3s = { git = "https://github.com/Nugine/s3s", rev = "12028c873ed1aad406a232ef2ac096c882e545bf" }

# HTTP server (for /metrics endpoint only)
hyper = { version = "1.9" }
hyper-util = { version = "0.1.20", features = [
    "server-auto",
    "server-graceful",
    "http1",
    "http2",
    "tokio",
] }
http-body-util = "0.1.3"

# CLI
clap = { version = "4.6", features = ["derive"] }
dotenv = { version = "0.15" }

# CLI user-add generates S3 credentials via rand
hex = "0.4.3"
rand = "0.10"

# Metrics
prometheus = { version = "0.14", features = ["process"] }
aws-sigv4 = { version = "1.4", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = "1.2"
url = "2.5"
humantime = "2.3"

[dev-dependencies]
s3s-aws = { git = "https://github.com/Nugine/s3s", package = "s3s-aws", rev = "12028c873ed1aad406a232ef2ac096c882e545bf" }
aws-config = { version = "1.8", default-features = false }
aws-credential-types = { version = "1.2", features = ["test-util"] }
aws-sdk-s3 = { version = "1.131", features = ["behavior-version-latest"] }
once_cell = "1.21"
tempfile = "3.27"
log = "0.4.29"
env_logger = "0.11.10"
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.10"

[[bench]]
name = "fjall_benchmark"
harness = false
path = "benches/fjall_benchmark.rs"

[[bench]]
name = "casfs_benchmark"
harness = false
path = "benches/casfs_benchmark.rs"
