[workspace]
members = ["cas-storage", "s3-cas"]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Lee Smet <lee.smet@hotmail.com>"]

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.52", features = ["full"] }
async-trait = "0.1.89"
async-fs = "2.2"
futures = "0.3.32"

# Storage backend
fjall = "3.1"

# Hashing and crypto
md-5 = { version = "0.11" }
faster-hex = "0.10"

# Data structures
bytes = "1.11"
uuid = { version = "1.23", features = ["v4"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1"

# Error handling
anyhow = { version = "1.0.102" }

# Logging and tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Time
chrono = "0.4.44"

# Utilities
lazy_static = "1.5"

[profile.release]
lto = true
codegen-units = 1
